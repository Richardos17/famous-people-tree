spring.application.name=family-tree

# Neo4j connection
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=
spring.neo4j.database=neo4j

# GraphQL
spring.graphql.graphiql.enabled=false

# Server
server.port=8080

# Wikidata
wikidata.sparql.base-url=https://query.wikidata.org
wikidata.sparql.user-agent=FamilyTreeDemo/1.0 (contact@example.com)
